<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>Customer Churn AI</h1>
                <p>Predict churn risk and understand why.</p>
            </div>

            <div class="status">
                ● API Connected
            </div>
        </header>


        <main>

            <!-- INPUT SECTION -->

            <section class="card">

                <h2>Customer Information</h2>

                <form id="predictionForm">

                    <div class="grid">

                        <div class="field">
                            <label>Gender</label>
                            <select id="gender">
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Senior Citizen</label>
                            <select id="SeniorCitizen">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Partner</label>
                            <select id="Partner">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Dependents</label>
                            <select id="Dependents">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Tenure (months)</label>
                            <input id="tenure" type="number" min="0" value="5">
                        </div>

                        <div class="field">
                            <label>Phone Service</label>
                            <select id="PhoneService">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Multiple Lines</label>
                            <select id="MultipleLines">
                                <option>No</option>
                                <option>Yes</option>
                                <option>No phone service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Internet Service</label>
                            <select id="InternetService">
                                <option>Fiber optic</option>
                                <option>DSL</option>
                                <option>No</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Online Security</label>
                            <select id="OnlineSecurity">
                                <option>No</option>
                                <option>Yes</option>
                                <option>No internet service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Online Backup</label>
                            <select id="OnlineBackup">
                                <option>No</option>
                                <option>Yes</option>
                                <option>No internet service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Device Protection</label>
                            <select id="DeviceProtection">
                                <option>No</option>
                                <option>Yes</option>
                                <option>No internet service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Tech Support</label>
                            <select id="TechSupport">
                                <option>No</option>
                                <option>Yes</option>
                                <option>No internet service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Streaming TV</label>
                            <select id="StreamingTV">
                                <option>Yes</option>
                                <option>No</option>
                                <option>No internet service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Streaming Movies</label>
                            <select id="StreamingMovies">
                                <option>Yes</option>
                                <option>No</option>
                                <option>No internet service</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Contract</label>
                            <select id="Contract">
                                <option>Month-to-month</option>
                                <option>One year</option>
                                <option>Two year</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Paperless Billing</label>
                            <select id="PaperlessBilling">
                                <option>Yes</option>
                                <option>No</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Payment Method</label>
                            <select id="PaymentMethod">

                                <option>
                                    Electronic check
                                </option>

                                <option>
                                    Mailed check
                                </option>

                                <option>
                                    Bank transfer (automatic)
                                </option>

                                <option>
                                    Credit card (automatic)
                                </option>

                            </select>
                        </div>

                        <div class="field">
                            <label>Monthly Charges</label>
                            <input
                                id="MonthlyCharges"
                                type="number"
                                step="0.01"
                                value="80.50"
                            >
                        </div>

                        <div class="field">
                            <label>Total Charges</label>
                            <input
                                id="TotalCharges"
                                type="number"
                                step="0.01"
                                value="400.20"
                            >
                        </div>

                    </div>

                    <button type="submit">
                        🔮 Predict Churn
                    </button>

                </form>

            </section>


            <!-- RESULT SECTION -->

            <section
                id="result"
                class="card result-card hidden"
            >

                <h2>Prediction Result</h2>

                <div class="probability">

                    <span id="probability">
                        0%
                    </span>

                    <small>
                        Churn Probability
                    </small>

                </div>


                <div id="prediction"
                     class="prediction">
                </div>


                <div class="factors">

                    <h3>
                        🔍 Top Influencing Factors
                    </h3>

                    <div id="factorsList">
                    </div>

                </div>


                <div class="explanation">

                    <h3>
                        🤖 AI Explanation
                    </h3>

                    <p id="explanationText">
                    </p>

                </div>

            </section>

        </main>

    </div>


    <script src="app.js"></script>

</body>

</html>
